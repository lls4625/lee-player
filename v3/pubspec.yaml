name: leeplayer
description: "Local course video player for iOS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  liquid_glass_widgets: 1.3.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/legal/PRIVACY_POLICY.txt
    - assets/legal/COPYRIGHT_NOTICE.txt
    - assets/legal/LIQUID_GLASS_WIDGETS_LICENSE.txt
    - assets/legal/NATIVE_THIRD_PARTY_NOTICES.txt
    - assets/legal/OPEN_SOURCE_OFFER.txt
    - assets/legal/licenses/
